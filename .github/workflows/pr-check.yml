name: PR Checks

on:
  pull_request:
    branches: [main]

jobs:
  check:
    name: Validate & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate content
        run: npm run validate

      - name: Type check
        run: npm run check

      - name: Build (no deploy)
        run: npm run build
